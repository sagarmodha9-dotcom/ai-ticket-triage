name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Evals with the fake model
        # The fake model is keyword rules, so it can't pass the judgment scenarios (phishing,
        # paraphrased outages, note requests). These floors catch regressions in the pipeline.
        run: |
          python evals/run_evals.py --min-accuracy 1.0
          python evals/run_agent_evals.py --min-pass-rate 0.6

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t ai-ticket-triage .
      - name: Smoke test the running container
        run: |
          docker run -d --name app -p 8000:8000 ai-ticket-triage
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/agent -H "Content-Type: application/json" \
            -d '{"message": "Is there a VPN outage right now?"}' | tee out.json
          grep -q '"stopped": "done"' out.json
      - name: Container logs
        if: always()
        run: docker logs app || true
